name: dog-vision
channels:
  - defaults
dependencies:
  - python=3.10  ## specify desired version
  - pip

  # General tools
  - cytoolz
  - ipython
  - jupyterlab

  # Data analysis
  - numpy=1.26
  - matplotlib
  - pandas

  # Scikit-learn
  - scikit-learn

  ## PyPI packages (tensorflow)
  - pip:
    - tensorflow==2.15
    - tensorflow-metal  ## optional, but recommended
    - tensorflow_hub  ## A repository of trained machine learning models
